name: 自动发布到 npm

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: 设置 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '23.7.0'
        registry-url: 'https://registry.npmjs.org'
        
    - name: 安装依赖
      run: npm ci

    - name: 验证核心文件
      run: |
        echo "✅ 验证项目结构..."
        ls -la package.json
        ls -la cli/index.js
        echo "✅ 核心文件存在，准备发布"
      
    - name: 获取当前版本
      id: current_version
      run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      
    - name: 检查版本是否已发布
      id: check_version
      run: |
        CURRENT_VERSION="${{ steps.current_version.outputs.version }}"
        if npm view todoflow-backend@$CURRENT_VERSION version 2>/dev/null; then
          echo "exists=true" >> $GITHUB_OUTPUT
          echo "版本 $CURRENT_VERSION 已存在于 npm"
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "版本 $CURRENT_VERSION 不存在，可以发布"
        fi
        
    - name: 自动升级版本
      if: steps.check_version.outputs.exists == 'true'
      run: |
        echo "当前版本已存在，自动升级 patch 版本"
        npm version patch --no-git-tag-version
        NEW_VERSION=$(node -p "require('./package.json').version")
        echo "新版本: $NEW_VERSION"
        
    - name: 发布到 npm
      run: |
        FINAL_VERSION=$(node -p "require('./package.json').version")
        echo "准备发布版本: $FINAL_VERSION"
        npm publish --access public
        echo "✅ 成功发布版本 $FINAL_VERSION 到 npm!"
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        
    - name: 创建 Git 标签
      run: |
        FINAL_VERSION=$(node -p "require('./package.json').version")
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git tag -a "v$FINAL_VERSION" -m "Release v$FINAL_VERSION"
        git push origin "v$FINAL_VERSION"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: 发布成功通知
      run: |
        FINAL_VERSION=$(node -p "require('./package.json').version")
        echo "🎉 TodoFlow CLI v$FINAL_VERSION 已成功发布到 npm!"
        echo "用户现在可以通过以下命令安装:"
        echo "npm install -g todoflow-backend@$FINAL_VERSION"
