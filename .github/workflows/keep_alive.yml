name: Keep Repository Alive

on:
  schedule:
    # 每30天运行一次（每月1日和15日）
    - cron: "0 0 1,15 * *"
  # 允许手动触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update timestamp
        run: |
          echo "Last activity: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > .github/LAST_ACTIVITY

      - name: Commit and push changes
        run: |
          git config --global user.name 'wenisy'
          git config --global user.email 'wenisy@gmail.com'
          git add .github/LAST_ACTIVITY

          # 如果有变更则提交
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: keep repository alive - $(date +'%Y-%m-%d')"
            git push
          fi
