name: Keep Repository Alive

on:
  schedule:
    # 每30天运行一次（每月1日和15日）
    - cron: "0 0 1,15 * *"
  # 允许手动触发
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update timestamp
        run: |
          echo "Last activity: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > .github/LAST_ACTIVITY

      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .github/LAST_ACTIVITY
          git diff --staged --quiet || git commit -m "chore: keep repository alive [skip ci]"
          git push
